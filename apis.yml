name: Onramp Payments
description: >-
  Onramp Payments, Inc. (ONRAMP) is a fintech company building modern payments
  infrastructure for the commercial trucking and fleet industry. Founded by
  logistics and payments veterans and backed by Canaan Partners, the company
  operates an enterprise-grade digital platform that replaces legacy card-based
  fleet payment systems. For carriers it offers cardless fuel payments at the
  pump, administrative spend controls, and maintenance payment solutions; for
  merchants it provides digital payment acceptance, pricing controls, and fraud
  prevention that work both in-store and at fuel pumps; and for partners it
  offers API integrations, broker solutions, and Transportation Management
  System (TMS) connections. The company markets itself as the easiest, most
  secure payments platform for carriers and merchants and has raised roughly
  $21M from investors including Canaan Partners, CEAS Investments, Contour
  Venture Partners, Javelin Venture Partners, and RedBlue Capital. As of this
  enrichment pass ONRAMP publishes no public developer portal, API reference,
  SDKs, or OpenAPI, so this profile captures verified company identity and
  probed domain-security posture only.
